<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 760">
<title id="title">System X-Ray of a governed prospective-client intake workflow</title>
<desc id="desc">The original submission is preserved as the authoritative record. Independently structured party, conflict, deadline, jurisdiction, and safety fields feed human conflict and urgency review. An optional AI synopsis is isolated as a secondary representation, compared against the source by a human, and prohibited from autonomously clearing conflicts, calculating deadlines, accepting or declining matters, or sending communications.</desc>
<rect width="1200" height="760" fill="#f7f1e6"/><style>.h{font:700 25px Arial,sans-serif;fill:#101815}.t{font:600 18px Arial,sans-serif;fill:#101815}.s{font:400 16px Arial,sans-serif;fill:#26332f}.k{font:700 14px Arial,sans-serif;letter-spacing:1px;fill:#101815}.box{stroke:#101815;stroke-width:3}.line{stroke:#101815;stroke-width:3;fill:none}.dash{stroke:#6d625b;stroke-width:3;stroke-dasharray:10 8;fill:none}</style>
<text x="55" y="52" class="k">ISSUE 01 · NORMATIVE WORKFLOW MODEL · NOT OBSERVED FIRM PRACTICE</text>
<text x="55" y="92" class="h">Preserve the source. Separate the synopsis. Keep decisions human-owned.</text>
<rect x="55" y="145" width="300" height="140" rx="8" fill="#fff" class="box"/><text x="80" y="180" class="k">AUTHORITATIVE RECORD</text><text x="80" y="218" class="t">Original submission</text><text x="80" y="248" class="s">Attachments · warnings · timestamp</text>
<rect x="450" y="125" width="300" height="180" rx="8" fill="#c9f5e5" class="box"/><text x="475" y="160" class="k">INDEPENDENT STRUCTURE</text><text x="475" y="198" class="t">Parties · adverse parties</text><text x="475" y="228" class="t">Deadlines · jurisdiction</text><text x="475" y="258" class="t">Safety · requested action</text>
<rect x="845" y="145" width="300" height="140" rx="8" fill="#ffe58a" class="box"/><text x="870" y="180" class="k">HUMAN SCREEN</text><text x="870" y="218" class="t">Conflict + urgency review</text><text x="870" y="248" class="s">Missing facts remain visible</text>
<path d="M355 215H450" class="line"/><path d="M750 215H845" class="line"/><path d="M438 205l12 10-12 10M833 205l12 10-12 10" fill="#101815"/>
<rect x="250" y="390" width="300" height="150" rx="8" fill="#ded5ff" class="box"/><text x="275" y="425" class="k">OPTIONAL SECONDARY LAYER</text><text x="275" y="463" class="t">AI-generated synopsis</text><text x="275" y="493" class="s">Labeled · versioned · source-linked</text>
<rect x="650" y="390" width="300" height="150" rx="8" fill="#fff" class="box"/><text x="675" y="425" class="k">ACCOUNTABLE COMPARISON</text><text x="675" y="463" class="t">Human compares to source</text><text x="675" y="493" class="s">Correct · log · stop · escalate</text>
<path d="M205 285V465H250" class="dash"/><path d="M550 465H650" class="dash"/><path d="M638 455l12 10-12 10" fill="#6d625b"/>
<rect x="165" y="625" width="870" height="82" rx="8" fill="#101815"/><text x="200" y="660" style="font:700 18px Arial,sans-serif;fill:#fff">Human-owned disposition</text><text x="200" y="687" style="font:400 16px Arial,sans-serif;fill:#fff">seek information · schedule · decline · refer · communicate actual next step</text>
<path d="M995 285V625" class="line"/><path d="M800 540V625" class="dash"/>
<text x="55" y="590" class="k">PROHIBITED AUTONOMY</text><text x="55" y="616" class="s">No conflict clearance · deadline calculation · merit judgment · acceptance/decline · outbound notice</text>
</svg>