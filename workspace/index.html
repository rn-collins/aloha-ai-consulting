<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aloha AI Workspace</title><meta name="robots" content="noindex,nofollow"><style>:root{--ink:#0d1714;--mint:#7fe0c4;--paper:#f4f5f1;--line:#dce3de;--muted:#5a6861;--bad:#9b2d22}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--ink);color:white;padding:28px 20px}.side a{color:white;text-decoration:none}.brand{font-weight:800}.brand span{color:var(--mint)}.nav{margin-top:34px;display:grid;gap:8px}.nav button{background:transparent;border:0;color:#c6d4cd;text-align:left;padding:10px;border-radius:9px;font:inherit;cursor:pointer}.nav button.active{background:#1a2b24;color:white}.main{padding:34px}.bar{display:flex;justify-content:space-between;gap:18px;align-items:center}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:7px}textarea{min-height:140px}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--ink);color:white;font-weight:750;cursor:pointer}.btn.mint{background:var(--mint);color:#104b3e}.muted{color:var(--muted)}.status{padding:10px 12px;border-radius:10px;background:#edf2ef;margin-top:12px}.hidden{display:none}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{padding:18px}.nav{display:flex;overflow:auto;margin-top:16px}.main{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><a class="brand" href="/">Aloha AI · <span>Workspace</span></a><div class="nav"><button class="active" data-view="home">Overview</button><button data-view="drafts">Drafts</button><button data-view="evidence">Evidence</button><button data-view="review">Review</button><button id="signout">Sign out</button></div></aside><main class="main"><div class="bar"><div><div class="muted">Authenticated platform</div><h1 id="title">Workspace</h1></div><a href="/twins/console">Public Twin Lab</a></div><section id="auth" class="card"><h2>Sign in or create an account</h2><div class="grid"><form id="signin"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="8"></label><button class="btn" type="submit">Sign in</button></form><form id="signup"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="8"></label><button class="btn mint" type="submit">Create account</button></form></div><div id="authStatus" class="status">Checking session…</div></section><section id="app" class="hidden"><div class="card"><h2>Organization and first project</h2><form id="bootstrap"><div class="grid"><label>Organization name<input name="organizationName" value="RN Collins LLC" required></label><label>Project name<input name="projectName" value="Trust-Safe Twin Workspace" required></label></div><button class="btn mint" type="submit">Create first workspace</button></form><div id="workspaceStatus" class="status">Sign in, then create the first organization and project.</div></div><div class="grid"><div class="card"><h2>Persist a draft</h2><form id="draftForm"><label>Organization ID<input name="organizationId" required></label><label>Project ID<input name="projectId" required></label><label>Draft<textarea name="content" required></textarea></label><button class="btn" type="submit">Save draft</button></form></div><div class="card"><h2>Persist evidence</h2><form id="evidenceForm"><label>Organization ID<input name="organizationId" required></label><label>Project ID<input name="projectId" required></label><label>Title<input name="title" required></label><label>Source text<textarea name="content"></textarea></label><button class="btn" type="submit">Save evidence</button></form></div></div><div id="result" class="card"><h2>API result</h2><pre id="output">No action yet.</pre></div></section></main></div><script>const $=s=>document.querySelector(s);async function call(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function body(form){return Object.fromEntries(new FormData(form).entries())}function show(data){$('#output').textContent=JSON.stringify(data,null,2)}async function check(){try{const d=await call('/api/platform/auth/session');$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#title').textContent=d.user.email;show(d)}catch{$('#authStatus').textContent='Not signed in.'}}check();$('#signin').onsubmit=async e=>{e.preventDefault();try{show(await call('/api/platform/auth/sign-in',{method:'POST',body:JSON.stringify(body(e.target))}));location.reload()}catch(x){$('#authStatus').textContent=x.message}};$('#signup').onsubmit=async e=>{e.preventDefault();try{const d=await call('/api/platform/auth/sign-up',{method:'POST',body:JSON.stringify(body(e.target))});show(d);$('#authStatus').textContent=d.confirmationRequired?'Check your email to confirm the account.':'Account created.';if(!d.confirmationRequired)location.reload()}catch(x){$('#authStatus').textContent=x.message}};$('#signout').onclick=async()=>{await call('/api/platform/auth/sign-out',{method:'POST'});location.reload()};$('#bootstrap').onsubmit=async e=>{e.preventDefault();try{const d=await call('/api/platform/workspace/bootstrap',{method:'POST',body:JSON.stringify(body(e.target))});show(d);$('#workspaceStatus').textContent='Workspace created. IDs are shown below.'}catch(x){$('#workspaceStatus').textContent=x.message}};$('#draftForm').onsubmit=async e=>{e.preventDefault();try{show(await call('/api/platform/drafts',{method:'POST',body:JSON.stringify(body(e.target))}))}catch(x){show({error:x.message})}};$('#evidenceForm').onsubmit=async e=>{e.preventDefault();try{show(await call('/api/platform/evidence',{method:'POST',body:JSON.stringify(body(e.target))}))}catch(x){show({error:x.message})}};</script></body></html>
