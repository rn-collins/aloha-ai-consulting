name: Link check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: npm ci
      - name: Build canonical site routes
        run: npm run site:build
      - name: Check internal repository links
        id: internal
        continue-on-error: true
        run: python scripts/check_internal_links.py > internal-link-report.txt 2>&1
      - name: Upload internal link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-report
          path: internal-link-report.txt
      - name: Fail if internal links are broken
        if: steps.internal.outcome == 'failure'
        run: |
          cat internal-link-report.txt
          exit 1
      - name: Audit external links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 3
            --timeout 30
            --accept 200,204,206,403,429
            --exclude-mail
            './**/*.html'
            './**/*.md'
          fail: false
