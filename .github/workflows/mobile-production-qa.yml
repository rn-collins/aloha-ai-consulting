name: Mobile production QA

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-production-qa.yml"
      - "scripts/mobile-production-qa.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Vercel preview at 390x844
        env:
          BASE_URL: https://aloha-ai-consulting-rbimpku8v-rn-collins.vercel.app
          SHARE_URL: https://aloha-ai-consulting-rbimpku8v-rn-collins.vercel.app/?_vercel_share=fERgSJXTtXgPoEfSNeU908wagsaRTLa6
        run: node scripts/mobile-production-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aloha-ai-mobile-production-qa
          path: mobile-production-qa/
          if-no-files-found: error
