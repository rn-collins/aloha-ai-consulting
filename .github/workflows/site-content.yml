name: Structured site validation

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'lib/site/**'
      - 'scripts/build-site.js'
      - 'scripts/validate-generated-html.js'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/site-content.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'lib/site/**'
      - 'scripts/build-site.js'
      - 'scripts/validate-generated-html.js'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/site-content.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate, build, and inspect generated pages
        run: npm run site:ci
